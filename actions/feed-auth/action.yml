# Credentials for the firmfooting package feed, with no stored secret: the
# job's GitHub OIDC token is exchanged for a short-lived Entra token for a
# service principal, and uv reads it from the environment.
#
# The calling job needs `permissions: id-token: write`. The tenant and client
# IDs come from the caller (organisation variables), so this public action
# names no tenant. Entra issues a token only to the GitHub subjects registered
# on the service principal.
name: Firmfooting package feed credentials
description: Export uv credentials for the firmfooting package feed from GitHub OIDC.

inputs:
  tenant-id:
    description: The Entra tenant that holds the service principal.
    required: true
  client-id:
    description: The service principal's application (client) ID.
    required: true
  role:
    description: "`read` to install from the feed, `publish` to also upload to it."
    default: read

runs:
  using: composite
  steps:
    - name: Exchange the OIDC token for a feed token
      shell: bash
      env:
        TENANT_ID: ${{ inputs.tenant-id }}
        CLIENT_ID: ${{ inputs.client-id }}
        ROLE: ${{ inputs.role }}
      run: "$GITHUB_ACTION_PATH/feed-auth.sh"
