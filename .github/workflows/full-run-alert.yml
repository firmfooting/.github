# Keeps ONE issue open while an hourly full-suite run is failing. A failed run
# opens the issue, or comments on it if it is already open, with the run link
# and SHA. A later green run closes it. Any other result changes nothing.
name: Full-run alert

on:
  workflow_call:
    inputs:
      result:
        description: The suite's result, success or failure. Anything else is ignored.
        type: string
        required: true
      runner:
        description: The runs-on label for the job.
        type: string
        default: ubuntu-24.04-arm

permissions: {}

jobs:
  alert:
    runs-on: ${{ inputs.runner }}
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ inputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="ci: hourly full suite failing on main"
          number=$(gh issue list --state open --author app/github-actions \
            --search "\"$title\" in:title" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          body="Run: $RUN_URL"$'\n'"SHA: $HEAD_SHA"
          case $RESULT in
            failure)
              if [[ -n $number ]]; then
                gh issue comment "$number" --body "$body"
              else
                gh issue create --title "$title" --body "$body"
              fi
              ;;
            success)
              if [[ -n $number ]]; then
                gh issue close "$number" --comment "Green again."$'\n'"$body"
              fi
              ;;
          esac
