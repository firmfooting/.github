# The org's git-hook gate, called by every repository's own prek.yml. It runs
# every pre-commit-stage hook in the repository's .pre-commit-config.yaml over
# the whole tree, so CI and a contributor's `prek run --all-files` are the same
# check. Markdown style runs here through the markdownlint-cli2 hook, which
# keeps its version in one place: that hook's `rev:`.
#
# A uv project (one with a uv.lock) pins prek in its dev group, and its local
# hooks call the project's own pinned tools through `uv run`, so the lock names
# every version. A repository with no Python project runs the prek pinned here.
name: prek

on:
  workflow_call:
    inputs:
      runner:
        description: The runs-on label for the job.
        type: string
        default: ubuntu-24.04-arm

permissions: {}

jobs:
  prek:
    # arm64: a hook or locked dependency that ships only an x86_64 binary or
    # wheel fails here, in the calling repository, not in this one.
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      # The markdownlint hook is a node package; declared so it does not run on
      # whatever node the runner image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run every hook over the whole tree
        env:
          PREK_VERSION: 0.5.3
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            uv run --locked prek run --all-files --show-diff-on-failure
          else
            uvx "prek@${PREK_VERSION}" run --all-files --show-diff-on-failure
          fi
