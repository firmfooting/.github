# This repository's own run of the shared audit in zizmor.yml, called by path
# so a change to it is proved on the pull request that makes it.
name: Workflow security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yml
