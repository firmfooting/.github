name: Changed test runner

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  runner-tests:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise Git selection and subprocess failures
        run: python3 -m unittest discover -s tests -v
