# The org's workflow security audit, called by every repository's own
# zizmor.yml. It fails on any finding: an action not pinned to a commit,
# broader permissions than a job uses, a persisted checkout credential, a
# template expanded inside a script, cache poisoning on a release path.
#
# It runs the zizmor hook from the repository's .pre-commit-config.yaml, so
# the version is that hook's `rev:` and nothing else. The offline audit a
# contributor runs on commit and the online one here cannot drift apart. A
# repository without the hook fails here rather than going unaudited.
name: Workflow security

on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    # arm64: zizmor and prek install as aarch64 builds; an action or hook that
    # ships only an x86_64 binary fails in the calling repository, not here.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Audit workflows
        env:
          # A token turns on the online audits: impostor commits and actions
          # with a published advisory, both resolved against the pinned SHA.
          GH_TOKEN: ${{ github.token }}
          PREK_VERSION: 0.5.3
        # uvx, not the project's lock: the hook's `rev:` fixes zizmor either way,
        # and a lock out of step with pyproject.toml must not fail the audit.
        run: uvx "prek@${PREK_VERSION}" run zizmor --all-files
